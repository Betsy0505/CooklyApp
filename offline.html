<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f8fafc;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #1e293b;
            font-size: 24px;
        }
        p {
            color: #64748b;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Sin conexión a internet</h1>
        <p>No hay problema, puedes seguir usando tu despensa con los datos guardados.</p>
        <p style="font-size: 14px; color: #94a3b8;">Los cambios se sincronizarán cuando vuelvas a tener conexión.</p>
        <a href="/" class="btn">Volver a la app</a>
    </div>
</body>
</html>
