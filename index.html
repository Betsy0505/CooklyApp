<script>
// ===== CONFIGURACIÓN BASEROW =====
// const BASEROW_API = 'https://api.baserow.io/api/database/rows/table/';
const BASEROW_API = 'https://api.baserow.io/api/database/rows/table/';
const TABLA_RECETAS = '1119570'; // Reemplaza con tu ID
const TABLA_INGREDIENTES = '1119597';
const TABLA_PLAN = '1119572';
const TABLA_HISTORIAL = '1119598';
const TOKEN = ''; 

// ===== ESTADO GLOBAL =====
let estado = {
    recetas: [],
    ingredientes: [],
    planSemanal: [],
    historial: [],
    categoriaActiva: 'todas',
};

let ingredientesDisponibles = [];

// ===== FUNCIONES BASE =====
async function fetchBaserow(tableId) {
    try {
        const res = await fetch(`${BASEROW_API}${tableId}/?user_field_names=true`, {
            headers: { 'Authorization': `Token ${TOKEN}` }
        });
        if (!res.ok) throw new Error(`Error HTTP: ${res.status}`);
        return await res.json();
    } catch (error) {
        console.error('Error obteniendo datos de Baserow:', error);
        return { results: [] };
    }
}

async function postBaserow(tableId, data) {
    try {
        const res = await fetch(`${BASEROW_API}${tableId}/?user_field_names=true`, {
            method: 'POST',
            headers: { 
                'Authorization': `Token ${TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        if (!res.ok) {
            const errBody = await res.json().catch(() => ({}));
            throw new Error(errBody.detail || errBody.error || `Error HTTP: ${res.status}`);
        }
        return await res.json();
    } catch (error) {
        console.error('Error enviando a Baserow:', error);
        throw error;
    }
}

async function patchBaserow(tableId, rowId, data) {
    try {
        const res = await fetch(`${BASEROW_API}${tableId}/${rowId}/?user_field_names=true`, {
            method: 'PATCH',
            headers: {
                'Authorization': `Token ${TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        if (!res.ok) {
            const errBody = await res.json().catch(() => ({}));
            throw new Error(errBody.detail || errBody.error || `Error HTTP: ${res.status}`);
        }
        return await res.json();
    } catch (error) {
        console.error('Error actualizando en Baserow:', error);
        throw error;
    }
}

async function deleteBaserow(tableId, rowId) {
    try {
        const res = await fetch(`${BASEROW_API}${tableId}/${rowId}/`, {
            method: 'DELETE',
            headers: { 'Authorization': `Token ${TOKEN}` }
        });
        if (!res.ok && res.status !== 204) {
            const errBody = await res.json().catch(() => ({}));
            throw new Error(errBody.detail || errBody.error || `Error HTTP: ${res.status}`);
        }
    } catch (error) {
        console.error('Error eliminando en Baserow:', error);
        throw error;
    }
}

// ===== SINCAR DATOS =====
async function sincronizarTodo() {
    const btn = document.getElementById('btnSync');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando...';
    btn.disabled = true;
    
    try {
        const [recetas, ingredientes, plan, historial] = await Promise.all([
            fetchBaserow(TABLA_RECETAS),
            fetchBaserow(TABLA_INGREDIENTES),
            fetchBaserow(TABLA_PLAN),
            fetchBaserow(TABLA_HISTORIAL)
        ]);
        
        estado.recetas = recetas.results || [];
        estado.ingredientes = ingredientes.results || [];
        estado.planSemanal = plan.results || [];
        estado.historial = historial.results || [];
        
        renderizarTodo();
        actualizarListaIngredientes();
        
    } catch(e) {
        console.error('Error al sincronizar:', e);
        alert('⚠️ Error sincronizando datos. Verifica tu conexión.');
    }
    
    btn.innerHTML = '<i class="fas fa-sync-alt"></i> Sincronizar';
    btn.disabled = false;
}

// ===== RENDERIZADO PRINCIPAL =====
function renderizarTodo() {
    renderizarPlanSemanal();
    renderizarRecetas();
    renderizarDespensa();
    renderizarRecomendaciones();
}

// ===== PLAN SEMANAL =====
function renderizarPlanSemanal() {
    const container = document.getElementById('planSemanalContainer');
    const dias = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
    const hoy = new Date();
    const inicioSemana = new Date(hoy.setDate(hoy.getDate() - hoy.getDay() + 1));
    
    // Actualizar fecha
    document.getElementById('semanaFecha').textContent = inicioSemana.toLocaleDateString('es', { month: 'long', day: 'numeric' });

    let html = '';
    for (let i = 0; i < 7; i++) {
        const fecha = new Date(inicioSemana);
        fecha.setDate(fecha.getDate() + i);
        const fechaStr = fecha.toISOString().split('T')[0];
        const comidasDelDia = estado.planSemanal.filter(p => p.Fecha === fechaStr);
        
        html += `<div class="bg-white rounded-xl p-3 mb-3 shadow-sm border-l-4 border-cookly">
            <div class="flex justify-between items-center">
                <span class="font-bold">${dias[i]}</span>
                <span class="text-sm text-gray-500">${fechaStr}</span>
            </div>
            <div class="mt-2 space-y-2">
                ${['desayuno', 'almuerzo', 'cena'].map(tipo => {
                    const comida = comidasDelDia.find(c => c.Comida === tipo);
                    const receta = comida ? estado.recetas.find(r => r.id === comida.Receta) : null;
                    return `<div class="flex justify-between items-center text-sm">
                        <span class="capitalize w-20 text-gray-600">${tipo}</span>
                        ${receta ? 
                            `<span class="bg-orange-50 text-orange-800 px-2 py-1 rounded-lg flex-1 ml-2">${receta.Nombre}</span>` :
                            `<button class="btn-agregar-comida text-xs bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded-lg" data-fecha="${fechaStr}" data-comida="${tipo}">+ Agregar</button>`
                        }
                        ${receta ? `<button class="btn-cambiar-comida text-xs text-orange-500 hover:text-orange-700 ml-1" data-receta="${receta.id}" data-fecha="${fechaStr}" data-comida="${tipo}"><i class="fas fa-exchange-alt"></i></button>` : ''}
                    </div>`;
                }).join('')}
            </div>
        </div>`;
    }
    container.innerHTML = html;

    document.querySelectorAll('.btn-agregar-comida').forEach(btn => {
        btn.onclick = () => agregarComidaRapida(btn.dataset.fecha, btn.dataset.comida);
    });
    document.querySelectorAll('.btn-cambiar-comida').forEach(btn => {
        btn.onclick = () => cambiarComida(btn.dataset.receta, btn.dataset.fecha, btn.dataset.comida);
    });
}

async function agregarComidaRapida(fecha, tipo) {
    if (estado.recetas.length === 0) {
        alert('No hay recetas disponibles. ¡Agrega algunas primero!');
        return;
    }
    const recetasDisponibles = estado.recetas.map((r, i) => `${i+1}: ${r.Nombre}`).join('\n');
    const seleccion = prompt(`Selecciona una receta (número) para ${tipo} el ${fecha}:\n${recetasDisponibles}`);
    if (seleccion) {
        const idx = parseInt(seleccion) - 1;
        const receta = estado.recetas[idx];
        if (receta) {
            try {
                await postBaserow(TABLA_PLAN, {
                    Fecha: fecha,
                    Comida: tipo,
                    Receta: receta.id,
                    '¿Completado?': false
                });
                sincronizarTodo();
            } catch (e) {
                alert('Error al agregar al plan. Intenta de nuevo.');
            }
        }
    }
}

async function cambiarComida(recetaId, fecha, tipo) {
    const otrasRecetas = estado.recetas.filter(r => r.id !== recetaId);
    if (otrasRecetas.length === 0) {
        alert('No hay otras recetas disponibles.');
        return;
    }
    const opciones = otrasRecetas.map((r, i) => `${i+1}: ${r.Nombre}`).join('\n');
    const seleccion = prompt(`Reemplazar con:\n${opciones}`);
    if (seleccion) {
        const idx = parseInt(seleccion) - 1;
        if (otrasRecetas[idx]) {
            const planActual = estado.planSemanal.find(p => p.Fecha === fecha && p.Comida === tipo);
            if (planActual) {
                try {
                    await fetch(`${BASEROW_API}${TABLA_PLAN}/${planActual.id}/?user_field_names=true`, {
                        method: 'PATCH',
                        headers: { 'Authorization': `Token ${TOKEN}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ Receta: otrasRecetas[idx].id })
                    });
                    sincronizarTodo();
                } catch (e) {
                    alert('Error al cambiar la receta.');
                }
            }
        }
    }
}

// ===== DESPENSA =====
function renderizarDespensa() {
    const container = document.getElementById('despensaContainer');
    const idsRecetasPlan = [...new Set(estado.planSemanal.map(p => p.Receta))];
    const recetasEnPlan = estado.recetas.filter(r => idsRecetasPlan.includes(r.id));
    
    let ingredientesMap = new Map();
    recetasEnPlan.forEach(receta => {
        if (receta.Ingredientes) {
            receta.Ingredientes.split('\n').forEach(line => {
                const match = line.match(/^([\d.]+)\s*(\w+)\s*(.+)$/);
                if (match) {
                    const [, cantidad, unidad, nombre] = match;
                    const key = nombre.trim().toLowerCase();
                    if (!ingredientesMap.has(key)) {
                        ingredientesMap.set(key, { nombre: nombre.trim(), cantidad: 0, unidad, recetas: [] });
                    }
                    const item = ingredientesMap.get(key);
                    item.cantidad += parseFloat(cantidad);
                    item.recetas.push(receta.Nombre);
                }
            });
        }
    });

    if (ingredientesMap.size === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-4">Sin ingredientes en tu plan semanal</div>`;
        return;
    }

    container.innerHTML = [...ingredientesMap.values()].map(item => `
        <div class="flex items-center gap-3 p-2 bg-white rounded-lg shadow-sm hover:shadow-md transition">
            <input type="checkbox" class="ingrediente-check h-5 w-5 rounded border-gray-300 text-orange-500 focus:ring-orange-500" />
            <div class="flex-1">
                <span class="font-medium">${item.nombre}</span>
                <span class="text-sm text-gray-500 ml-2">${item.cantidad.toFixed(1)} ${item.unidad}</span>
                <div class="text-xs text-gray-400">${item.recetas.join(', ')}</div>
            </div>
        </div>
    `).join('');

    document.getElementById('buscarIngrediente').oninput = (e) => {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('#despensaContainer .flex').forEach(el => {
            el.style.display = el.textContent.toLowerCase().includes(term) ? 'flex' : 'none';
        });
    };
}

function buscarRecetasPorIngredientes() {
    if (ingredientesDisponibles.length === 0) {
        document.getElementById('resultadosPorIngredientes').innerHTML = 
            '<p class="text-gray-400 text-center">Agrega ingredientes para buscar recetas</p>';
        return;
    }

    const resultados = estado.recetas.map(receta => {
        let coincidencias = 0;
        let ingredientesFaltantes = [];
        let ingredientesReceta = [];

        if (receta.Ingredientes) {
            ingredientesReceta = receta.Ingredientes.split('\n').map(line => {
                const match = line.match(/^[\d.]*\s*\w*\s*(.+)$/);
                return match ? match[1].trim().toLowerCase() : line.trim().toLowerCase();
            });

            ingredientesReceta.forEach(ingReceta => {
                const coincide = ingredientesDisponibles.some(ingDisp => 
                    ingReceta.includes(ingDisp) || ingDisp.includes(ingReceta)
                );
                if (coincide) {
                    coincidencias++;
                } else {
                    ingredientesFaltantes.push(ingReceta);
                }
            });
        }

        const porcentajeCoincidencia = ingredientesReceta.length > 0 
            ? Math.round((coincidencias / ingredientesReceta.length) * 100) 
            : 0;

        return {
            ...receta,
            coincidencias,
            totalIngredientes: ingredientesReceta.length,
            porcentaje: porcentajeCoincidencia,
            ingredientesFaltantes: ingredientesFaltantes.slice(0, 5)
        };
    });

    resultados.sort((a, b) => b.porcentaje - a.porcentaje);
    const resultadosFiltrados = resultados.filter(r => r.coincidencias > 0);

    const container = document.getElementById('resultadosPorIngredientes');
    
    if (resultadosFiltrados.length === 0) {
        container.innerHTML = `
            <div class="bg-yellow-50 p-4 rounded-lg text-center">
                <p class="text-yellow-800">😅 No se encontraron recetas con esos ingredientes</p>
                <p class="text-sm text-gray-600 mt-1">Prueba agregando más ingredientes o revisa la ortografía</p>
            </div>
        `;
        return;
    }

    container.innerHTML = `
        <div class="flex justify-between items-center mb-2">
            <h4 class="font-semibold">📋 ${resultadosFiltrados.length} recetas encontradas</h4>
            <span class="text-xs text-gray-500">Mejores coincidencias primero</span>
        </div>
        ${resultadosFiltrados.map(receta => `
            <div class="bg-white rounded-xl p-3 shadow-sm border-l-4 ${getColorCategoria(receta.Categoría)}">
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 flex-wrap">
                            <h3 class="font-bold">${receta.Nombre}</h3>
                            <span class="badge-categoria ${getBadgeClass(receta.Categoría)}">${receta.Categoría || 'Sin categoría'}</span>
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            <div class="w-24 bg-gray-200 rounded-full h-2">
                                <div class="bg-green-500 h-2 rounded-full" style="width: ${receta.porcentaje}%"></div>
                            </div>
                            <span class="text-xs font-medium">${receta.porcentaje}% coincide</span>
                            <span class="text-xs text-gray-500">(${receta.coincidencias}/${receta.totalIngredientes})</span>
                        </div>
                        ${receta.ingredientesFaltantes.length > 0 ? `
                            <div class="mt-1">
                                <span class="text-xs text-red-500">Te falta:</span>
                                <span class="text-xs text-gray-600">${receta.ingredientesFaltantes.join(', ')}</span>
                            </div>
                        ` : `
                            <div class="mt-1">
                                <span class="text-xs text-green-500">✅ ¡Tienes todos los ingredientes!</span>
                            </div>
                        `}
                    </div>
                    <div class="flex flex-col gap-1">
                        <button class="btn-usar-receta-result text-orange-500 text-sm" data-id="${receta.id}">
                            <i class="fas fa-plus-circle"></i> Plan
                        </button>
                        <button class="btn-ver-receta text-gray-500 text-sm" data-id="${receta.id}">
                            <i class="fas fa-eye"></i> Ver
                        </button>
                    </div>
                </div>
            </div>
        `).join('')}
    `;

    document.querySelectorAll('#resultadosPorIngredientes .btn-usar-receta-result').forEach(btn => {
        btn.onclick = () => {
            const receta = estado.recetas.find(r => r.id === parseInt(btn.dataset.id));
            if (receta) agregarAlPlan(receta);
        };
    });

    document.querySelectorAll('#resultadosPorIngredientes .btn-ver-receta').forEach(btn => {

            const receta = estado.recetas.find(r => r.id === parseInt(btn.dataset.id));
            if (receta) mostrarDetalleReceta(receta);
        };
    });
}

// ===== ESCÁNER DE RECETAS =====
function parsearReceta(texto) {
    const lines = texto.split('\n').filter(l => l.trim());
    const nombre = lines[0]?.trim() || 'Receta sin nombre';
    
    const idxIngredientes = lines.findIndex(l => /ingredientes?/i.test(l));
    const idxInstrucciones = lines.findIndex(l => /instrucciones?|preparación|modo/i.test(l));
    
    const ingredientes = [];
    let instrucciones = [];
    
    if (idxIngredientes !== -1 && idxInstrucciones !== -1) {
        for (let i = idxIngredientes+1; i < idxInstrucciones; i++) {
            if (lines[i].trim()) ingredientes.push(lines[i].trim());
        }
        for (let i = idxInstrucciones+1; i < lines.length; i++) {
            if (lines[i].trim()) instrucciones.push(lines[i].trim());
        }
    } else {
        lines.slice(1).forEach(line => {
            if (/\d/.test(line) && /gr|kg|l|ml|ud|pieza|taza|cuchara|unidad|gramos|litro/i.test(line)) {
                ingredientes.push(line);
            } else {
                instrucciones.push(line);
            }
        });
    }

    return {
        Nombre: nombre,
        Ingredientes: ingredientes.join('\n'),
        Instrucciones: instrucciones.join('\n'),
        Categoría: detectarCategoria(nombre + ' ' + ingredientes.join(' ')),
        Tiempo: parseInt(extraerTiempo(texto)) || 30,
        Dificultad: 'Media'
    };
}

function detectarCategoria(texto) {
    const lower = texto.toLowerCase();
    if (/pescado|salmón|atún|merluza|bacalao|trucha|sardina/i.test(lower)) return 'pescado';
    if (/pollo|pavo|pato|pechuga|muslo|contramuslo/i.test(lower)) return 'pollo';
    if (/cerdo|ternera|res|cordero|bistec|chuleta|filete|costilla/i.test(lower)) return 'carne';
    if (/vegetariano|tofu|seitán|tempeh|garbanzo|lenteja|quinoa|soja/i.test(lower)) return 'vegetariano';
    if (/pasta|espagueti|fideos|macarrones|tallarines|spaghetti|fettuccine/i.test(lower)) return 'pasta';
    if (/sopa|caldo|crema|puré|potaje|guiso|estofado/i.test(lower)) return 'sopa';
    if (/ensalada|lechuga|espinaca|rúcula|canónigos|mix|verduras|hortalizas/i.test(lower)) return 'ensalada';
    return 'otro';
}

function extraerTiempo(texto) {
    const match = texto.match(/(\d+)\s*(min|hora|hr|minutos)/i);
    return match ? match[1] : 30;
}

    document.getElementById('edTiempo').value = receta.Tiempo || 30;
    document.getElementById('edDificultad').value = receta.Dificultad || 'Media';
    document.getElementById('edIngredientes').value = receta.Ingredientes || '';
    document.getElementById('edInstrucciones').value = receta.Instrucciones || '';
    document.getElementById('modalEditar').style.display = 'block';
}

document.getElementById('btnCerrarModalEditar').onclick = () => {
    document.getElementById('modalEditar').style.display = 'none';
    recetaEnEdicion = null;
};

document.getElementById('btnGuardarEdicion').onclick = async () => {
    if (!recetaEnEdicion) return;
    const cambios = {
        Nombre: document.getElementById('edNombre').value.trim() || 'Receta sin nombre',
        Categoría: document.getElementById('edCategoria').value,
        Tiempo: parseInt(document.getElementById('edTiempo').value) || 30,
        Dificultad: document.getElementById('edDificultad').value,
        Ingredientes: document.getElementById('edIngredientes').value,
        Instrucciones: document.getElementById('edInstrucciones').value
    };
    try {
        await patchBaserow(TABLA_RECETAS, recetaEnEdicion.id, cambios);
        document.getElementById('modalEditar').style.display = 'none';
        recetaEnEdicion = null;
        sincronizarTodo();
        alert('✅ Receta actualizada');
    } catch (e) {
        alert('Error al actualizar la receta: ' + e.message);
    }
};

document.getElementById('btnEliminarReceta').onclick = async () => {
    if (!recetaEnEdicion) return;
    if (!confirm(`¿Eliminar "${recetaEnEdicion.Nombre}"? Esto no se puede deshacer.`)) return;
    try {
        await deleteBaserow(TABLA_RECETAS, recetaEnEdicion.id);
        document.getElementById('modalEditar').style.display = 'none';
        recetaEnEdicion = null;
        sincronizarTodo();
        alert('🗑️ Receta eliminada');
    } catch (e) {
        alert('Error al eliminar la receta: ' + e.message);
    }
};

// ===== EVENTOS =====
document.addEventListener('DOMContentLoaded', () => {
    sincronizarTodo();

    // Pestañas
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.className = b.className.replace('tab-active', 'tab-inactive');
            });
            btn.className = btn.className.replace('tab-inactive', 'tab-active');
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('hidden');
        };
    });

    // Filtros de categoría
    document.querySelectorAll('.filtro-categoria').forEach(btn => {
        btn.onclick = () => {
            estado.categoriaActiva = btn.dataset.cat;
            document.querySelectorAll('.filtro-categoria').forEach(b => {
                b.className = b.className.replace('bg-orange-600 text-white', 'bg-orange-100');
            });
            btn.className += ' bg-orange-600 text-white';
            renderizarRecetas();
        };
    });
    document.querySelector('.filtro-categoria[data-cat="todas"]')?.classList.add('bg-orange-600', 'text-white');

    // Modal escáner
    document.getElementById('btnEscanearReceta').onclick = () => {
        document.getElementById('modalEscanear').style.display = 'block';
    };
    document.getElementById('btnCerrarModal').onclick = () => {
        document.getElementById('modalEscanear').style.display = 'none';
    };
    document.getElementById('btnCerrarModal2').onclick = () => {
        document.getElementById('modalEscanear').style.display = 'none';
    };
    
    const CATEGORIAS_VALIDAS = ['pescado','carne','vegetariano','pasta','pollo','sopa','ensalada','otro'];

    document.getElementById('btnProcesarTexto').onclick = async () => {
        const texto = document.getElementById('textoReceta').value;
        if (!texto) return alert('¡Pega una receta primero!');
        const recetaParseada = parsearReceta(texto);
        document.getElementById('resultadoParse').innerHTML = `
            <div class="bg-green-50 p-3 rounded-lg space-y-2">
                <p class="text-xs text-gray-500 mb-1">Revisa y corrige antes de guardar:</p>
                <div>
                    <label class="text-xs font-medium text-gray-600">Nombre</label>
                    <input id="fpNombre" type="text" class="w-full p-2 border rounded-lg text-sm" value="${recetaParseada.Nombre.replace(/"/g,'&quot;')}">
                </div>
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="text-xs font-medium text-gray-600">Categoría</label>
                        <select id="fpCategoria" class="w-full p-2 border rounded-lg text-sm">
                            ${CATEGORIAS_VALIDAS.map(c => `<option value="${c}" ${c===recetaParseada.Categoría?'selected':''}>${c}</option>`).join('')}
                        </select>
                    </div>
                    <div class="w-24">
                        <label class="text-xs font-medium text-gray-600">Tiempo (min)</label>
                        <input id="fpTiempo" type="number" class="w-full p-2 border rounded-lg text-sm" value="${recetaParseada.Tiempo}">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-medium text-gray-600">Ingredientes (uno por línea)</label>
                    <textarea id="fpIngredientes" rows="4" class="w-full p-2 border rounded-lg text-sm">${recetaParseada.Ingredientes}</textarea>
                </div>
                <div>
                    <label class="text-xs font-medium text-gray-600">Instrucciones</label>
                    <textarea id="fpInstrucciones" rows="4" class="w-full p-2 border rounded-lg text-sm">${recetaParseada.Instrucciones}</textarea>
                </div>
                <button id="btnGuardarParse" class="mt-1 btn-primary text-sm px-4 py-1 w-full">Guardar Receta</button>
            </div>
        `;
        document.getElementById('btnGuardarParse').onclick = async () => {
            const recetaFinal = {
                Nombre: document.getElementById('fpNombre').value.trim() || 'Receta sin nombre',
                Categoría: document.getElementById('fpCategoria').value,
                Tiempo: parseInt(document.getElementById('fpTiempo').value) || 30,
                Ingredientes: document.getElementById('fpIngredientes').value,
                Instrucciones: document.getElementById('fpInstrucciones').value,
                Dificultad: recetaParseada.Dificultad
            };
            try {
                await postBaserow(TABLA_RECETAS, recetaFinal);
                document.getElementById('modalEscanear').style.display = 'none';
                document.getElementById('textoReceta').value = '';
                document.getElementById('resultadoParse').innerHTML = '';
                sincronizarTodo();
                alert('✅ ¡Receta guardada con éxito!');
            } catch (e) {
                alert('Error al guardar la receta: ' + e.message);
            }
        };
    };

    // Compartir lista
    document.getElementById('btnCompartirLista').onclick = () => {
        const items = document.querySelectorAll('#despensaContainer .flex');
        const texto = [...items].map(el => el.textContent.trim()).join('\n');
        if (navigator.share) {
            navigator.share({ title: 'Lista de Compras Cookly', text: texto });
        } else {
            navigator.clipboard.writeText(texto).then(() => alert('¡Lista copiada al portapapeles!'));
        }
    };

    // Sincronizar manual
    document.getElementById('btnSync').onclick = sincronizarTodo;
});

// ===== REGISTRAR SERVICE WORKER =====
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .then(registration => {
                console.log('✅ Service Worker registrado con éxito:', registration);
            })
            .catch(error => {
                console.log('❌ Error al registrar Service Worker:', error);
            });
    });
}

// ===== DETECTAR MODO OFFLINE =====
window.addEventListener('online', () => {
    const estadoEl = document.getElementById('estadoConexion');
    estadoEl.textContent = '🟢 En línea';
    estadoEl.className = 'text-xs estado-online';
});

window.addEventListener('offline', () => {
    const estadoEl = document.getElementById('estadoConexion');
    estadoEl.textContent = '🔴 Sin conexión';
    estadoEl.className = 'text-xs estado-offline';
});

// Verificar estado inicial
if (!navigator.onLine) {
    document.getElementById('estadoConexion').textContent = '🔴 Sin conexión';
    document.getElementById('estadoConexion').className = 'text-xs estado-offline';
}
</script>

</body>
</html>
