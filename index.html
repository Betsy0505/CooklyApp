async function agregarAlPlan(receta) {
    if (!receta) return;
    const fecha = new Date().toISOString().split('T')[0];
    const tipo = await pedirTipoComida();
    if (tipo && ['desayuno','comida','cena'].includes(tipo.toLowerCase())) {
        const itemLocal = guardarPlanLocal(fecha, tipo, receta.id);
        actualizarTipoRecetaLocal(receta.id, tipo);
        renderizarTodo();
        try {
            const respuesta = await guardarPlanEnBaserow(fecha, tipo, receta.id);
            if (respuesta && respuesta.id) {
                const index = estado.planSemanal.findIndex(p =>
                    p.Fecha === fecha && normalizarTipoComida(p.Comida) === normalizarTipoComida(tipo)
                );
                if (index >= 0) {
                    estado.planSemanal[index].id = respuesta.id;
                }
            }
            renderizarPlanSemanal();
        } catch (e) {
            try {
                const respuesta = await postBaserow(TABLA_PLAN, {
                    Fecha: fecha,
                    Comida: obtenerTipoComidaBaserow(tipo),
                    Active: true,
                    Receta: [Number(receta.id)],
                    '¿Completado?': false
                });
                if (respuesta && respuesta.id) {
                    await registrarConsumoReceta(Number(receta.id), 1, fecha);
                }
                const index = estado.planSemanal.findIndex(p =>
                    p.Fecha === fecha && normalizarTipoComida(p.Comida) === normalizarTipoComida(tipo)
                );
                if (index >= 0) {
                    estado.planSemanal[index].id = respuesta.id;
                }
                renderizarPlanSemanal();
            } catch (fallbackError) {
                estado.planSemanal = estado.planSemanal.filter(p => !(p.Fecha === fecha && normalizarTipoComida(p.Comida) === normalizarTipoComida(tipo) && p.Receta === receta.id && p.id === itemLocal.id));
                renderizarPlanSemanal();
                alert('Error al agregar al plan.');
            }
        }
    }
}

// ===== ESCÁNER DE RECETAS =====

// Cuando el texto se copia de una página web, es común que se pierdan los saltos de línea
// y todo quede pegado, ej: "Ingredientes500g de pollo...12 a 15 tortillas..."
// Esta función reconstruye los saltos de línea detectando dónde una palabra quedó pegada
// directamente a un número, o donde una minúscula quedó pegada a una mayúscula.
function normalizarTextoRecetaPegado(texto) {
    let resultado = String(texto || '')
        .replace(/\r/g, '')
        // Separa encabezados aunque estén completamente pegados al contenido.
        .replace(/\s*(Ingredientes?)\s*:?\s*/gi, '\nIngredientes:\n')
        .replace(/\s*(Pasos?)\s*:?\s*/gi, '\nPasos:\n')
        .replace(/\s*(Instrucciones?)\s*:?\s*/gi, '\nInstrucciones:\n')
        .replace(/\s*(Preparaci[oó]n)\s*:?\s*/gi, '\nPreparación:\n')
        .replace(/\s*(Modo\s+de\s+preparaci[oó]n)\s*:?\s*/gi, '\nModo de preparación:\n');

    resultado = resultado
        .replace(/([a-záéíóúñ)\.])(\d)/gi, '$1\n$2')
        .replace(/(\d)([A-Za-zÁÉÍÓÚÑáéíóúñ])/g, '$1\n$2')
        .replace(/([a-záéíóúñ])([A-ZÁÉÍÓÚÑ])/g, '$1\n$2');

    return resultado
        .split('\n')
        .map(linea => linea.trim())
        .filter(Boolean)
        .join('\n');
}

function esEncabezadoIngredientes(linea) {
    return /^\s*ingredientes?\s*:?(?:\s|$)/i.test(String(linea || ''));
}

function esEncabezadoPasos(linea) {
    return /^\s*(?:pasos?|instrucciones?|preparaci[oó]n|modo(?:\s+de\s+preparaci[oó]n)?)\s*:?(?:\s|$)/i.test(String(linea || ''));
}

function limpiarEncabezado(linea, tipo) {
    const patron = tipo === 'ingredientes'
        ? /^\s*ingredientes?\s*:?\s*/i
        : /^\s*(?:pasos?|instrucciones?|preparaci[oó]n|modo(?:\s+de\s+preparaci[oó]n)?)\s*:?\s*/i;
    return String(linea || '').replace(patron, '').trim();
}

function separarIngredientesEnLineas(texto) {
    return String(texto || '')
        .split(/\r?\n/)
        .flatMap(linea => {
            const limpia = linea
                .replace(/^\s*[-•*]\s*/, '')
                .trim();

            if (!limpia) return [];

            // Separa ingredientes delimitados por coma o punto y coma.
            // No separa números decimales como "1,5 tazas".
            return limpia
                .split(/[,;]\s+(?=[A-Za-zÁÉÍÓÚÑáéíóúñ])/)
                .map(item => item.trim())
                .filter(Boolean)
                .map(item => item.replace(/^y\s+/i, '').trim());
        });
}

function parsearReceta(texto) {
    const textoNormalizado = normalizarTextoRecetaPegado(texto)
        // Separa pasos pegados: "leche.Derrite..." -> dos líneas.
        .replace(/\.\s+(?=[A-ZÁÉÍÓÚÑ])/g, '.\n');

    const lines = textoNormalizado.split('\n').map(l => l.trim()).filter(Boolean);
    const nombre = lines[0] || 'Receta sin nombre';

    // Reconoce: Ingredientes / Pasos / Instrucciones / Preparación / Modo de preparación
    const idxIngredientes = lines.findIndex(esEncabezadoIngredientes);
    const idxInstrucciones = lines.findIndex((line, index) => index > idxIngredientes && esEncabezadoPasos(line));

    const ingredientes = [];
    const instrucciones = [];

    if (idxIngredientes !== -1 && idxInstrucciones !== -1 && idxInstrucciones > idxIngredientes) {
        // Puede haber contenido en la misma línea que el encabezado.
        const restoIngredientes = limpiarEncabezado(lines[idxIngredientes], 'ingredientes');
        if (restoIngredientes) ingredientes.push(...separarIngredientesEnLineas(restoIngredientes));

        for (let i = idxIngredientes + 1; i < idxInstrucciones; i++) {
            if (lines[i]) ingredientes.push(...separarIngredientesEnLineas(lines[i]));
        }

        const restoPasos = limpiarEncabezado(lines[idxInstrucciones], 'pasos');
        if (restoPasos) instrucciones.push(restoPasos);

        for (let i = idxInstrucciones + 1; i < lines.length; i++) {
            if (lines[i]) instrucciones.push(lines[i]);
        }
    } else {
        // Respaldo: solo considera unidades completas, no la letra "l" dentro de palabras.
        const patronUnidad = /(?:\b(?:gr|g|kg|mg|ml|l|cc|cl|oz|ud|pieza|piezas|taza|tazas|cucharada|cucharadas|cucharadita|cucharaditas|cdita|cdta|unidad|unidades|litro|litros|diente|dientes|trozo|trozos|pizca|pizcas|ramita|ramitas|hoja|hojas|rebanada|rebanadas|sobre|sobres)\b)/i;

        lines.slice(1).forEach(line => {
            if (/\d/.test(line) && patronUnidad.test(line)) {
                ingredientes.push(...separarIngredientesEnLineas(line));
            } else {
                instrucciones.push(line);
            }
        });
    }

    return {
        Nombre: nombre,
        Tipo: 'Otro',
        Ingredientes: ingredientes.join('\n'),
        Instrucciones: instrucciones.join('\n'),
        Categoría: detectarCategoria(nombre + ' ' + ingredientes.join(' ')),
        Tiempo: parseInt(extraerTiempo(texto)) || 30,
        Dificultad: 'Media'
    };
}



function detectarCategoria(texto) {
    const lower = texto.toLowerCase();
    if (/pescado|salmón|atún|merluza|bacalao|trucha|sardina/i.test(lower)) return 'pescado';
    if (/pollo|pavo|pato|pechuga|muslo|contramuslo/i.test(lower)) return 'pollo';
    if (/cerdo|ternera|res|cordero|bistec|chuleta|filete|costilla/i.test(lower)) return 'carne';
    if (/vegetariano|tofu|seitán|tempeh|garbanzo|lenteja|quinoa|soja/i.test(lower)) return 'vegetariano';
    if (/pasta|espagueti|fideos|macarrones|tallarines|spaghetti|fettuccine/i.test(lower)) return 'pasta';
    if (/sopa|caldo|crema|puré|potaje|guiso|estofado/i.test(lower)) return 'sopa';
    if (/ensalada|lechuga|espinaca|rúcula|canónigos|mix|verduras|hortalizas/i.test(lower)) return 'ensalada';
    return 'otro';
}

function extraerTiempo(texto) {
    const match = texto.match(/(\d+)\s*(min|hora|hr|minutos)/i);
    return match ? match[1] : 30;
}

// ===== EVENTOS =====
document.addEventListener('DOMContentLoaded', () => {
sincronizarTodo();

    // Pestañas
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.className = b.className.replace('tab-active', 'tab-inactive');
            });
            btn.className = btn.className.replace('tab-inactive', 'tab-active');
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('hidden');
        };
    });

    // Filtros de categoría
    document.querySelectorAll('.filtro-categoria').forEach(btn => {
        btn.onclick = () => {
            estado.categoriaActiva = btn.dataset.cat;
            document.querySelectorAll('.filtro-categoria').forEach(b => {
                b.classList.remove('active');
            });
            btn.classList.add('active');
            renderizarRecetas();
        };
    });

    // Modal escáner
    document.getElementById('btnEscanearReceta').onclick = () => {
        document.getElementById('modalEscanear').style.display = 'block';
    };
    document.getElementById('btnCerrarModal').onclick = () => {
        document.getElementById('modalEscanear').style.display = 'none';
    };
    document.getElementById('btnCerrarModal2').onclick = () => {
        document.getElementById('modalEscanear').style.display = 'none';
    };
    
    document.getElementById('btnProcesarTexto').onclick = async () => {
        const texto = document.getElementById('textoReceta').value;
        if (!texto) return alert('¡Pega una receta primero!');
        const recetaParseada = parsearReceta(texto);
        document.getElementById('resultadoParse').innerHTML = `
            <div class="bg-green-50 p-3 rounded-lg">
                <p><strong>${recetaParseada.Nombre}</strong></p>
                <p class="text-sm">Categoría: ${recetaParseada.Categoría} | Tiempo: ${recetaParseada.Tiempo}min</p>
                <p class="text-xs mt-1 text-gray-600">${recetaParseada.Ingredientes.split('\n').slice(0,2).join(', ')}...</p>
                <button id="btnGuardarParse" class="mt-2 btn-primary text-sm px-4 py-1">Guardar Receta</button>
            </div>
        `;
        document.getElementById('btnGuardarParse').onclick = async () => {
            const btnGuardar = document.getElementById('btnGuardarParse');
            setBotonCargando(btnGuardar, true, 'Guardando...');
            mostrarCargando('Guardando receta...');
            try {
                const recetaGuardada = await postBaserow(TABLA_RECETAS, recetaParseada);

                // Actualiza el estado local al instante, sin depender de una re-sincronización completa
                estado.recetas = [recetaGuardada, ...estado.recetas];
                irATabRecetas();
                renderizarRecetas();
                actualizarListaIngredientes();

                document.getElementById('modalEscanear').style.display = 'none';
                document.getElementById('textoReceta').value = '';
                document.getElementById('resultadoParse').innerHTML = '';

                // Resalta la tarjeta recién agregada para que se note de inmediato
                requestAnimationFrame(() => {
                    const card = document.querySelector(`.card-receta[data-id="${recetaGuardada.id}"]`);
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        card.classList.add('ring-2', 'ring-orange-400');
                        setTimeout(() => card.classList.remove('ring-2', 'ring-orange-400'), 2000);
                    }
                });

                alert('Receta guardada con éxito.');
            } catch (e) {
                alert('Error al guardar la receta.');
            } finally {
                setBotonCargando(btnGuardar, false);
                ocultarCargando();
            }
        };
    };

    // Compartir lista (copia siempre al portapapeles como texto)
    document.getElementById('btnCompartirLista').onclick = () => {
        const items = estado.listaCompras
            .filter(item => item && item.Active !== false)
            .map(item => item.Nombre.trim())
            .filter(Boolean);

        const texto = items.length
            ? `🛒 Lista de Compras 🧾\n\n${items.map((nombre, index) => `${index + 1}. 🥕 ${nombre}`).join('\n')}`
            : '🛒 Lista de Compras 🧾\n\nTu lista está vacía.';

        navigator.clipboard.writeText(texto)
            .then(() => alert('✅ ¡Lista copiada al portapapeles!'))
            .catch(() => alert('❌ No se pudo copiar la lista.'));
    };

    // Sincronizar manual
    document.getElementById('btnSync').onclick = sincronizarTodo;
});

// ===== REGISTRAR SERVICE WORKER =====
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .then(registration => {
                console.log('✅ Service Worker registrado con éxito:', registration);
            })
            .catch(error => {
                console.log('❌ Error al registrar Service Worker:', error);
            });
    });
}

// ===== DETECTAR MODO OFFLINE =====
window.addEventListener('online', () => {
    const estadoEl = document.getElementById('estadoConexion');
    estadoEl.innerHTML = '<i class="fas fa-circle text-[8px]"></i> En línea';
    estadoEl.className = 'text-xs estado-online inline-flex items-center gap-1.5';
});

window.addEventListener('offline', () => {
    const estadoEl = document.getElementById('estadoConexion');
    estadoEl.innerHTML = '<i class="fas fa-circle text-[8px]"></i> Sin conexión';
    estadoEl.className = 'text-xs estado-offline inline-flex items-center gap-1.5';
});

// Verificar estado inicial
if (!navigator.onLine) {
    document.getElementById('estadoConexion').innerHTML = '<i class="fas fa-circle text-[8px]"></i> Sin conexión';
    document.getElementById('estadoConexion').className = 'text-xs estado-offline inline-flex items-center gap-1.5';
}
</script>
