<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    
    <!-- ===== CONFIGURACIÓN PWA ===== -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png?v=4" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192.png?v=4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cookly" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f97316" />
    
    <!-- ===== SEO Y DESCRIPCIÓN ===== -->
    <title>Cookly - Asistente Inteligente de Cocina</title>
    <meta name="description" content="Cookly te ayuda a encontrar recetas, planificar comidas y comprar de forma inteligente. ¡Cocina con lo que tienes!" />
    
    <!-- ===== OPEN GRAPH ===== -->
    <meta property="og:title" content="Cookly - Asistente Inteligente de Cocina" />
    <meta property="og:description" content="Encuentra recetas, planifica comidas y cocina con lo que tienes en casa." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cookly.app" />
    
    <!-- ===== LIBRERÍAS ===== -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        /* ===== ESTILOS COOKLY ===== */
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #app {
            width: min(100%, 1100px);
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(12px, 2vw, 28px);
            background: #f8fafc;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        /* Colores Cookly */
        .bg-cookly { background: #f97316; }
        .bg-cookly-dark { background: #ea580c; }
        .text-cookly { color: #f97316; }
        .border-cookly { border-color: #f97316; }
        .hover-bg-cookly:hover { background: #f97316; }
        
        /* Botones */
        .btn-primary {
            background: #f97316;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #ea580c;
            transform: scale(1.02);
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
        
        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }

        .ia-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 12px;
        }

        .ia-header-badge,
        .ia-section-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(255, 138, 61, 0.18), rgba(249, 115, 22, 0.28));
            color: #f97316;
            box-shadow: 0 8px 18px rgba(249, 115, 22, 0.16);
            border: 1px solid rgba(249, 115, 22, 0.12);
        }

        .ia-section-card {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 20px;
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255,255,255,0.8);
            padding: 14px 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .ia-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .ia-metric-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(255, 237, 213, 0.9), rgba(254, 215, 170, 0.85));
            color: #9a4b00;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 700;
            min-width: 70px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
        }

        .ia-chart-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 140px;
            padding: 10px 6px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.54), rgba(148,163,184,0.08));
            border: 1px solid rgba(255,255,255,0.45);
            box-shadow: 0 10px 18px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255,255,255,0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        
        /* Pestañas */
        .tab-active {
            background: #f97316;
            color: white;
        }
        .tab-inactive {
            background: #e5e7eb;
            color: #374151;
        }

        .filtro-categoria {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0.75rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            font-size: 0.92rem;
            font-weight: 700;
            color: #374151;
            background: rgba(255, 255, 255, 0.36);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255,255,255,0.75);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filtro-categoria:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12), inset 0 1px 0 rgba(255,255,255,0.8);
        }

        .filtro-categoria span {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .filtro-categoria i {
            width: 1.7rem;
            height: 1.7rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.55);
            color: inherit;
            font-size: 0.8rem;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.8);
        }

        .filtro-categoria[data-cat="todas"] {
            background: rgba(255, 166, 91, 0.25);
            color: #9a4b00;
        }

        .filtro-categoria[data-cat="pescado"] {
            background: rgba(96, 165, 250, 0.22);
            color: #1d4ed8;
        }

        .filtro-categoria[data-cat="carne"] {
            background: rgba(248, 113, 113, 0.2);
            color: #b91c1c;
        }

        .filtro-categoria[data-cat="vegetariano"] {
            background: rgba(74, 222, 128, 0.2);
            color: #166534;
        }

        .filtro-categoria[data-cat="pasta"] {
            background: rgba(250, 204, 21, 0.2);
            color: #92400e;
        }

        .filtro-categoria[data-cat="pollo"] {
            background: rgba(251, 146, 60, 0.2);
            color: #9a4b00;
        }

        .filtro-categoria[data-cat="sopa"] {
            background: rgba(250, 204, 21, 0.18);
            color: #854d0e;
        }

        .filtro-categoria[data-cat="otro"] {
            background: rgba(148, 163, 184, 0.18);
            color: #334155;
        }

        .filtro-categoria.active {
            box-shadow: 0 14px 28px rgba(249, 115, 22, 0.2), inset 0 1px 0 rgba(255,255,255,0.8);
            border-color: rgba(249, 115, 22, 0.42);
            transform: translateY(-2px) scale(1.01);
        }
        
        /* Tarjetas */
        .card-receta {
            transition: all 0.2s;
            cursor: pointer;
        }
        .card-receta:active {
            transform: scale(0.97);
        }
        
        /* Etiquetas de categoría */
        .badge-categoria {
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 500;
        }
        .badge-pescado { background: #93c5fd; color: #1e3a5f; }
        .badge-carne { background: #fca5a5; color: #7f1d1d; }
        .badge-vegetariano { background: #86efac; color: #14532d; }
        .badge-pasta { background: #fde047; color: #713f12; }
        .badge-pollo { background: #fdba74; color: #7c2d12; }
        .badge-sopa { background: #fcd34d; color: #713f12; }
        .badge-ensalada { background: #6ee7b7; color: #064e3b; }
        .badge-otro { background: #d1d5db; color: #1f2937; }
        
        /* Ventana modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s;
        }
        .modal-contenido {
    background: white;
    width: min(500px, calc(100% - 24px));
    max-width: 500px;
    max-height: calc(100vh - 32px);
    margin: 16px auto;
    padding: 24px;
    border-radius: 16px;
    overflow-y: auto;
    box-sizing: border-box;
    animation: slideUp 0.3s;
}
.modal-editar {
    display: flex;
    flex-direction: column;
}

.formulario-editar {
    min-height: 0;
}

.formulario-editar textarea {
    resize: vertical;
    max-height: 180px;
}

.formulario-editar > div:last-child {
    position: sticky;
    bottom: 0;
    background: white;
    padding-top: 12px;
    padding-bottom: 2px;
    z-index: 2;
}
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* Barra de desplazamiento personalizada */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #f97316;
            border-radius: 10px;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            width: min(92vw, 420px);
        }

        .toast {
            pointer-events: auto;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: rgba(255,255,255,0.98);
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
            border-radius: 14px;
            padding: 14px 16px;
            color: #1f2937;
            border-left: 6px solid #22c55e;
            animation: toastIn 0.22s ease;
        }

        .toast.error {
            border-left-color: #ef4444;
        }

        .toast.warning {
            border-left-color: #f59e0b;
        }

        .toast-icon {
            width: 22px;
            min-width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #dcfce7;
            color: #15803d;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .toast.error .toast-icon {
            background: #fee2e2;
            color: #b91c1c;
        }

        .toast.warning .toast-icon {
            background: #fef3c7;
            color: #b45309;
        }

        .toast-body {
            flex: 1;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 600;
        }

        .toast-close {
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        /* Ingredientes seleccionados */
        .chip-ingrediente {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .chip-ingrediente .eliminar {
            cursor: pointer;
            color: #dc2626;
            font-weight: bold;
        }
        .chip-ingrediente .eliminar:hover {
            color: #991b1b;
        }

        .ingrediente-search-wrap {
            position: relative;
            width: 100%;
        }

        .ingrediente-dropdown {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 8px);
            background: white;
            border: 1px solid #fed7aa;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
            max-height: 220px;
            overflow-y: auto;
            display: none;
            z-index: 40;
        }

        .ingrediente-dropdown.visible {
            display: block;
        }

        .sugerencia-ingrediente {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border: none;
            background: white;
            color: #374151;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
        }

        .sugerencia-ingrediente:last-child {
            border-bottom: none;
        }

        .sugerencia-ingrediente:hover,
        .sugerencia-ingrediente:focus {
            background: #fff7ed;
            color: #c2410c;
            outline: none;
        }
        
        /* Botón flotante */
        .btn-flotante {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #f97316;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 100;
        }
        .btn-flotante:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.5);
        }
        .btn-flotante:active {
            transform: scale(0.9);
        }
        
        /* Estado de conexión */
        .estado-online { color: #22c55e; }
        .estado-offline { color: #ef4444; }
        
        /* Responsive */
        @media (min-width: 900px) {
            #app {
                padding-left: 28px;
                padding-right: 28px;
            }

            .tab-btn {
                font-size: 0.95rem;
                padding-top: 0.8rem;
                padding-bottom: 0.8rem;
            }

            .tab-content {
                max-width: 980px;
                margin: 0 auto;
            }

            #recetasContainer {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 480px) {
            #app { padding: 12px; }
            .modal-contenido { margin: 5% 10px; padding: 16px; }
        }
    </style>
</head>
<body>

<div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

<!-- ===== OVERLAY DE CARGA GLOBAL ===== -->
<div id="overlayCargando" class="hidden fixed inset-0 bg-black/50 z-[9999] flex items-center justify-center px-4">
    <div class="bg-white rounded-xl px-6 py-5 shadow-lg flex flex-col items-center gap-3 max-w-xs w-full text-center">
        <i class="fas fa-spinner fa-spin text-3xl text-orange-500"></i>
        <span id="overlayCargandoTexto" class="text-sm font-medium text-gray-700">Cargando...</span>
    </div>
</div>

<div id="app">
    <!-- ===== ENCABEZADO ===== -->
    <header class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-2">
            <img src="cookly-logo-header.png?v=3" alt="Cookly" class="h-16 w-auto object-contain" />
        </div>
        <div class="flex items-center gap-2">
            <span id="estadoConexion" class="text-xs estado-online inline-flex items-center gap-1.5"><i class="fas fa-circle text-[8px]"></i> En línea</span>
            <button id="btnSync" class="btn-primary text-sm px-3 py-1 rounded-full">
                <i class="fas fa-sync-alt"></i> Sincronizar
            </button>
        </div>
    </header>

    <!-- ===== SUBTÍTULO ===== -->
    <p class="text-sm text-gray-500 mb-4 text-center">
        <span class="inline-flex items-center gap-2 justify-center">
            <i class="fas fa-utensils text-orange-500"></i>
            <span>Cocina inteligente, come delicioso</span>
        </span>
    </p>

    <!-- ===== PESTAÑAS ===== -->
    <div class="flex gap-1 bg-gray-200 p-1 rounded-xl mb-4">
        <button class="tab-btn flex-1 py-2 px-3 rounded-lg text-sm font-medium tab-active" data-tab="plan"><i class="fas fa-calendar-alt"></i> Plan</button>
        <button class="tab-btn flex-1 py-2 px-3 rounded-lg text-sm font-medium tab-inactive" data-tab="recetas"><i class="fas fa-book"></i> Recetas</button>
        <button class="tab-btn flex-1 py-2 px-3 rounded-lg text-sm font-medium tab-inactive" data-tab="despensa"><i class="fas fa-shopping-cart"></i> Despensa</button>
        <button class="tab-btn flex-1 py-2 px-3 rounded-lg text-sm font-medium tab-inactive" data-tab="innovaciones"><i class="fas fa-brain"></i> IA</button>
    </div>

    <!-- ===== PESTAÑA: PLAN SEMANAL ===== -->
    <div id="tab-plan" class="tab-content">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-semibold">Semana del <span id="semanaFecha" class="text-cookly">Lunes</span></h2>
            <button id="btnAgregarComida" class="btn-primary text-sm">
                <i class="fas fa-file-export"></i> Exportar Comida Semanal
            </button>
        </div>
        <div id="planSemanalContainer"></div>
    </div>

    <!-- ===== PESTAÑA: RECETAS ===== -->
    <div id="tab-recetas" class="tab-content hidden">
        <div class="flex gap-2 mb-3 overflow-x-auto pb-2">
            <button class="filtro-categoria active" data-cat="todas"><span><i class="fas fa-filter"></i> Todas</span></button>
            <button class="filtro-categoria" data-cat="pescado"><span><i class="fas fa-fish"></i> Pescado</span></button>
            <button class="filtro-categoria" data-cat="carne"><span><i class="fas fa-drumstick-bite"></i> Carne</span></button>
            <button class="filtro-categoria" data-cat="vegetariano"><span><i class="fas fa-leaf"></i> Vegetariano</span></button>
            <button class="filtro-categoria" data-cat="pasta"><span><i class="fas fa-bowl-food"></i> Pasta</span></button>
            <button class="filtro-categoria" data-cat="pollo"><span><i class="fas fa-drumstick-bite"></i> Pollo</span></button>
            <button class="filtro-categoria" data-cat="sopa"><span><i class="fas fa-mug-hot"></i> Sopa</span></button>
            <button class="filtro-categoria" data-cat="otro"><span><i class="fas fa-tag"></i> Otro</span></button>
        </div>

        <div class="bg-white rounded-xl p-4 shadow-sm mb-4">
            <h3 class="font-semibold text-lg mb-2 flex items-center gap-2"><i class="fas fa-magnifying-glass text-orange-500"></i> Buscar por ingredientes</h3>
            <div class="flex flex-wrap gap-2 mb-3" id="ingredientesSeleccionados"></div>
            <div class="flex gap-2 items-start">
                <div class="ingrediente-search-wrap flex-1">
                    <input type="text" id="inputIngrediente" placeholder="Escribe un ingrediente..." class="w-full p-2 border rounded-lg text-sm" autocomplete="off" />
                    <div id="listaIngredientesDropdown" class="ingrediente-dropdown" aria-live="polite"></div>
                </div>
                <button id="btnAgregarIngrediente" class="btn-primary text-sm px-4">
                    <i class="fas fa-search"></i> Buscar Receta
                </button>
            </div>
            <button id="btnLimpiarIngredientes" class="text-xs text-red-500 mt-2 hover:text-red-700">
                <i class="fas fa-trash"></i> Limpiar todo
            </button>
        </div>

        <div id="resultadosPorIngredientes" class="space-y-3 mb-4"></div>
        <div id="recetasContainer" class="grid grid-cols-1 gap-3"></div>
    </div>

    <!-- ===== PESTAÑA: DESPENSA ===== -->
    <div id="tab-despensa" class="tab-content hidden">
        <!-- Lista de compras -->
        <div>
            <div class="flex items-center justify-between gap-2 mb-2">
                <h3 class="font-semibold text-lg">Lista de Compras</h3>
                <button id="btnAgregarIngredientesPlan" class="btn-secondary text-xs px-2 py-1 rounded-lg">
                    <i class="fas fa-plus"></i> Plan
                </button>
            </div>
            <div class="flex gap-2 mb-1">
    <input 
        type="text"
        id="inputListaCompras"
        placeholder="Agregar ingrediente..."
        class="flex-1 p-2 border rounded-lg text-sm"
        autocomplete="off"
    />

    <button
        id="btnAgregarListaCompras"
        type="button"
        class="btn-primary px-3 rounded-lg text-xl leading-none"
        aria-label="Agregar a la lista de compras">
        +
    </button>

    <button
        id="btnLimpiarListaCompras"
        type="button"
        class="btn-secondary px-3 rounded-lg text-sm whitespace-nowrap"
        aria-label="Limpiar lista de compras">
        <i class="fas fa-trash"></i> Limpiar Lista
    </button>
</div>

<div
    id="avisoIngredienteExistente"

<script>
function mostrarToast(mensaje, tipo = 'success') {
const container = document.getElementById('toastContainer');
if (!container) return;

const toast = document.createElement('div');
toast.className = `toast ${tipo}`;

const icon = document.createElement('i');
icon.className = tipo === 'error'
    ? 'toast-icon fas fa-circle-xmark'
    : tipo === 'warning'
        ? 'toast-icon fas fa-triangle-exclamation'
        : 'toast-icon fas fa-circle-check';

const body = document.createElement('div');
body.className = 'toast-body';
body.textContent = mensaje;

const close = document.createElement('button');
close.type = 'button';
close.className = 'toast-close';
close.setAttribute('aria-label', 'Cerrar notificación');
close.textContent = '×';
close.onclick = () => toast.remove();

toast.appendChild(icon);
toast.appendChild(body);
toast.appendChild(close);

container.appendChild(toast);

setTimeout(() => {
    toast.remove();
}, 2800);
}

function limpiarTextoAlerta(texto) {
    return String(texto || '').replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, '').replace(/\s{2,}/g, ' ').trim();
}

window.alert = function (mensaje) {
const texto = limpiarTextoAlerta(mensaje);
const tipo = /error|no se pudo|fallo|inténtalo|ocurrió|no hay|no se encontraron/i.test(texto)
    ? 'error'
    : /advertencia|aviso|atención/i.test(texto)
        ? 'warning'
        : 'success';
mostrarToast(texto, tipo);
};
// ===== CONFIGURACIÓN BASEROW =====
const BASEROW_API = 'https://api.baserow.io/api/database/rows/table/';
const TABLA_RECETAS = '1119570'; // Reemplaza con tu ID
const TABLA_INGREDIENTES = '1119597';
const TABLA_PLAN = '1119572';
const TABLA_HISTORIAL = '1119598';
const TABLA_LISTA_COMPRAS = '1134840';

async function obtenerTokenBaserow() {
    let tokenGuardado = window.BASEROW_TOKEN || localStorage.getItem('BASEROW_TOKEN') || '';

    if (!tokenGuardado) {
        try {
            const response = await fetch(`http://localhost:3000/api/getToken`, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' },
            });
            const data = await response.json();
            tokenGuardado = data.token;
            localStorage.setItem('BASEROW_TOKEN', tokenGuardado);
        } catch (err) {
            console.error('Error obteniendo token del endpoint:', err);
            return '';
        }
    }

    window.BASEROW_TOKEN = tokenGuardado;
    return String(tokenGuardado || '').trim();
}

function guardarTokenBaserow(token) {
    const valor = String(token || '').trim();
    if (!valor) return '';
    window.BASEROW_TOKEN = valor;
    localStorage.setItem('BASEROW_TOKEN', valor);
    return valor;
}

let TOKEN = ''; // se asigna de verdad dentro de sincronizarTodo() con await

// ===== ESTADO GLOBAL =====
let estado = {
    recetas: [],
    ingredientes: [],
    planSemanal: [],
    historial: [],
    listaCompras: [],
    categoriaActiva: 'todas',
};

let ingredientesDisponibles = [];
let syncRequestId = 0;

// ===== FUNCIONES BASE =====
async function fetchBaserow(tableId) {
    if (!TOKEN) {
        throw new Error('TOKEN_NO_CONFIGURADO');
    }

    try {
        const res = await fetch(`${BASEROW_API}${tableId}/?user_field_names=true`, {
            headers: { 'Authorization': `Token ${TOKEN}` }
        });
        if (res.status === 401) {
            TOKEN = '';
            window.BASEROW_TOKEN = '';
            localStorage.removeItem('BASEROW_TOKEN');
            throw new Error('TOKEN_INVALIDO');
        }
        if (!res.ok) throw new Error(`Error HTTP: ${res.status}`);
        return await res.json();
    } catch (error) {
        console.error('Error obteniendo datos de Baserow:', error);
        throw error;
    }
}

async function postBaserow(tableId, data) {
    try {
        const res = await fetch(`${BASEROW_API}${tableId}/?user_field_names=true`, {
            method: 'POST',
            headers: { 
                'Authorization': `Token ${TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error(`Error HTTP: ${res.status}`);
        return await res.json();
    } catch (error) {
        console.error('Error enviando a Baserow:', error);
        throw error;
    }
}

function normalizarListaComprasItem(item) {
    if (!item || typeof item !== 'object') return null;
    return {
        ...item,
        id: item.id,
        Nombre: item.Nombre ?? item.nombre ?? '',
        Comprado: Boolean(item.Comprado ?? item.comprado ?? false),
        Active: item.Active ?? item.active ?? true,
        FechaCreacion: item.FechaCreacion || item.fechaCreacion || new Date().toISOString().split('T')[0]
    };
}

async function cargarListaCompras() {
    const res = await fetchBaserow(TABLA_LISTA_COMPRAS);
    const items = (res.results || []).filter(item => item.Active !== false).map(normalizarListaComprasItem).filter(Boolean);
    estado.listaCompras = items;
    return items;
}

async function agregarListaCompras(nombre) {
    const valor = String(nombre || '').trim();
    if (!valor) return null;

    const payload = {
        Nombre: valor,
        Comprado: false,
        Active: true,
        FechaCreacion: new Date().toISOString().split('T')[0]
    };

    const respuesta = await postBaserow(TABLA_LISTA_COMPRAS, payload);
    const item = normalizarListaComprasItem(respuesta);
    if (item) {
        estado.listaCompras = [item, ...estado.listaCompras];
    }
    return item;
}

async function eliminarListaCompras(id) {
    const rowId = Number(id);

    if (!rowId) {
        throw new Error('ID de ingrediente inválido');
    }

    const url = `${BASEROW_API}${TABLA_LISTA_COMPRAS}/${rowId}/`;

    console.log('Eliminando ingrediente:', {
        id: rowId,
        url: url
    });

    const respuesta = await fetch(url, {
        method: 'DELETE',
        headers: {
            'Authorization': `Token ${TOKEN}`
        }
    });

    console.log('Respuesta DELETE:', rowId, respuesta.status);

    // 204 = eliminado correctamente
    // 404 = ya no existe, por lo tanto también lo podemos quitar de la lista
    if (!respuesta.ok && respuesta.status !== 404) {
        let detalle = '';

        try {
            detalle = await respuesta.text();
        } catch (e) {
            detalle = '';
        }

        console.error('Error eliminando fila:', {
            id: rowId,
            status: respuesta.status,
            detalle: detalle
        });

        throw new Error(
            `Error eliminando el ingrediente ${rowId}: HTTP ${respuesta.status}`
        );
    }

    // Quitar también del estado local
    estado.listaCompras = estado.listaCompras.filter(
        item => Number(item.id) !== rowId
    );

    return true;
}

function mostrarConfirmacionLimpiarLista(cantidad) {
    return new Promise((resolve) => {
        const modal = document.createElement('div');

        modal.className = 'modal';
        modal.style.display = 'block';
        modal.style.zIndex = '1500';

        modal.innerHTML = `
            <div class="modal-contenido" style="max-width: 420px;">

                <div class="flex justify-between items-start mb-3">
                    <h3 class="text-xl font-bold flex items-center gap-2">
                        <span>⚠️</span>
                        <span>Limpiar lista</span>
                    </h3>

                    <button
                        type="button"
                        class="cerrar-confirmacion text-gray-500 text-2xl hover:text-gray-700"
                        aria-label="Cerrar">
                        &times;
                    </button>
                </div>

                <div class="text-gray-600 mb-5">
                    <p class="mb-2">
                        ¿Seguro que quieres eliminar todos los ingredientes
                        de tu lista de compras?
                    </p>

                    <p class="text-sm text-gray-500">
                        Se eliminarán
                        <strong>${cantidad}</strong>
                        ingrediente${cantidad === 1 ? '' : 's'}.
                    </p>
                </div>

                <div class="flex gap-2">
                    <button
                        type="button"
                        class="btn-secondary flex-1 cerrar-confirmacion">
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="btn-primary flex-1 confirmar-limpiar-lista">
                        <i class="fas fa-trash"></i>
                        Limpiar lista
                    </button>
                </div>

            </div>
        `;

        document.body.appendChild(modal);

        let terminado = false;

        const cerrar = (resultado) => {
            if (terminado) return;

            terminado = true;
            modal.remove();
            resolve(resultado);
        };

        // Botones Cancelar y X
        modal.querySelectorAll('.cerrar-confirmacion').forEach(btn => {
            btn.addEventListener('click', () => cerrar(false));
        });

        // Botón Limpiar lista
        const btnConfirmar = modal.querySelector('.confirmar-limpiar-lista');

        btnConfirmar.addEventListener('click', () => {
            cerrar(true);
        });

        // Cerrar haciendo clic fuera de la ventana
        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                cerrar(false);
            }
        });
    });
}

async function limpiarListaCompras() {

    const items = estado.listaCompras.filter(
        item => item && item.Active !== false
    );

    if (items.length === 0) {
        mostrarToast(
            'La lista de compras ya está vacía.',
            'warning'
        );
        return;
    }

    const confirmar = await mostrarConfirmacionLimpiarLista(
        items.length
    );

    if (!confirmar) {
        return;
    }

    const btn = document.getElementById(
        'btnLimpiarListaCompras'
    );

    if (btn) {
        setBotonCargando(
            btn,
            true,
            'Limpiando...'
        );
    }

    mostrarCargando('Limpiando lista...');

    try {

        let eliminados = 0;
        let errores = 0;

        // Eliminar uno por uno
        for (const item of items) {

            try {

                await eliminarListaCompras(item.id);

                eliminados++;

            } catch (error) {

                errores++;

                console.error(
                    `No se pudo eliminar ${item.Nombre} (ID ${item.id})`,
                    error
                );
            }
        }

        // Volver a dejar el estado limpio
        estado.listaCompras = [];

        renderizarDespensa();

        const aviso = document.getElementById(
            'avisoIngredienteExistente'
        );

        if (aviso) {
            aviso.textContent = '';
        }

        const input = document.getElementById(
            'inputListaCompras'
        );

        if (input) {
            input.value = '';
        }

        if (errores === 0) {

            mostrarToast(
                'Lista de compras limpiada correctamente.',
                'success'
            );

        } else {

            mostrarToast(
                `Se eliminaron ${eliminados} ingredientes, pero ${errores} no pudieron eliminarse.`,
                'error'
            );
        }

    } catch (error) {

        console.error(
            'Error limpiando la lista de compras:',
            error
        );

        mostrarToast(
            'No se pudo limpiar la lista de compras.',
            'error'
        );

    } finally {

        ocultarCargando();

        if (btn) {
            setBotonCargando(
                btn,
                false
            );
        }
    }
}

async function actualizarListaCompras(id, cambios) {
    const rowId = Number(id);
    if (!rowId) return;

    await fetch(`${BASEROW_API}${TABLA_LISTA_COMPRAS}/${rowId}/?user_field_names=true`, {
        method: 'PATCH',
        headers: {
            'Authorization': `Token ${TOKEN}`,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(cambios)
    });

    estado.listaCompras = estado.listaCompras.map(item =>
        Number(item.id) === rowId ? { ...item, ...cambios } : item
    );
}

function tieneIdRealBaserow(valor) {
    if (valor === undefined || valor === null || valor === '') return false;
    const numero = Number(valor);
    return Number.isFinite(numero) && numero > 0 && numero < 1000000000000;
}

function normalizarRecetaId(valor) {
    if (Array.isArray(valor)) {
        if (valor.length === 0) return null;
        const primero = valor[0];
        if (primero && typeof primero === 'object') {
            return Number(primero.id ?? primero.value ?? primero);
        }
        return Number(primero);
    }

    if (valor && typeof valor === 'object') {
        return Number(valor.id ?? valor.value ?? valor);
    }

    if (valor === null || valor === undefined || valor === '') return null;
    return Number(valor);
}

function normalizarPlanSemanalItem(item) {
    if (!item || typeof item !== 'object') return item;
    return {
        ...item,
        Fecha: item.Fecha || item.fecha || '',
        Comida: normalizarTipoComida(item.Comida || item.comida || ''),
        Receta: normalizarRecetaId(item.Receta),
        '¿Completado?': item['¿Completado?'] ?? item.completado ?? false
    };
}

function mergePlanSemanal(serverPlan) {
    const serverItems = Array.isArray(serverPlan) ? serverPlan.map(normalizarPlanSemanalItem) : [];
    const merged = [...serverItems];

    estado.planSemanal.forEach(localItem => {
        const key = `${localItem.Fecha || ''}|${normalizarTipoComida(localItem.Comida)}`;
        const index = merged.findIndex(serverItem => {
            const serverKey = `${serverItem.Fecha || ''}|${normalizarTipoComida(serverItem.Comida)}`;
            return serverKey === key;
        });

        if (index >= 0) {
            const itemFinal = {
                ...merged[index],
                ...normalizarPlanSemanalItem(localItem),
                Fecha: localItem.Fecha || merged[index].Fecha,
                Comida: normalizarTipoComida(localItem.Comida || merged[index].Comida),
                Receta: normalizarRecetaId(localItem.Receta ?? merged[index].Receta)
            };
            if (!tieneIdRealBaserow(localItem.id)) {
                itemFinal.id = merged[index].id ?? localItem.id;
            }
            merged[index] = itemFinal;
        } else {
            merged.push(normalizarPlanSemanalItem(localItem));
        }
    });

    return merged;
}

// ===== SINCAR DATOS =====
async function sincronizarTodo() {
    TOKEN = await obtenerTokenBaserow();
    console.log("TKEN SINCRONIZAR", TOKEN);
    
    if (!TOKEN) {
        const token = window.prompt('Pega tu token de Baserow para cargar la información de la base de datos:');
        TOKEN = guardarTokenBaserow(token);
    }

    const btn = document.getElementById('btnSync');
    if (!btn) return;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando...';
    btn.disabled = true;

    if (!TOKEN) {
        mostrarToast('Falta el token de Baserow. Pégalo en el navegador para cargar tus datos.', 'warning');
        btn.innerHTML = '<i class="fas fa-sync-alt"></i> Sincronizar';
        btn.disabled = false;
        return;
    }
    
    try {
        const syncId = ++syncRequestId;
        const [recetas, ingredientes, plan, historial, listaCompras] = await Promise.all([
            fetchBaserow(TABLA_RECETAS),
            fetchBaserow(TABLA_INGREDIENTES),
            fetchBaserow(TABLA_PLAN),
            fetchBaserow(TABLA_HISTORIAL),
            fetchBaserow(TABLA_LISTA_COMPRAS)
        ]);

        if (syncId !== syncRequestId) return;
        
        estado.recetas = recetas.results || [];
        estado.ingredientes = ingredientes.results || [];
        estado.historial = historial.results || [];
        estado.listaCompras = (listaCompras.results || [])
            .filter(item => item.Active !== false)
            .map(normalizarListaComprasItem)
            .filter(Boolean);

        const serverPlan = (plan.results || []).map(normalizarPlanSemanalItem);
        estado.planSemanal = mergePlanSemanal(serverPlan);
        
        renderizarTodo();
        actualizarListaIngredientes();
        
    } catch(e) {
        console.error('Error al sincronizar:', e);
        if (String(e && e.message || '').includes('TOKEN')) {
            const nuevoToken = window.prompt('Tu token de Baserow no sirve o está vacío. Pégalo de nuevo para cargar tus datos:');
            TOKEN = guardarTokenBaserow(nuevoToken);
            if (TOKEN) {
                sincronizarTodo();
                return;
            }
        }
        alert('Error sincronizando datos. Verifica tu conexión o tu token de Baserow.');
    }
    
    btn.innerHTML = '<i class="fas fa-sync-alt"></i> Sincronizar';
    btn.disabled = false;
}

// ===== RENDERIZADO PRINCIPAL =====
function renderizarTodo() {
    renderizarPlanSemanal();
    renderizarRecetas();
    renderizarDespensa();
    renderizarRecomendaciones();
}

function normalizarTipoComida(value) {
    const texto = String(value ?? '').trim().toLowerCase();
    if (!texto) return '';
    return texto === 'almuerzo' ? 'comida' : texto;
}

function obtenerNombreTipoComida(tipo) {
    const valor = normalizarTipoComida(tipo);
    if (valor === 'comida') return 'Comida';
    return valor ? valor.charAt(0).toUpperCase() + valor.slice(1) : 'Comida';
}

function obtenerTipoComidaBaserow(tipo) {
    const valor = normalizarTipoComida(tipo);
    const mapa = {
        desayuno: 'Desayuno',
        comida: 'Comida',
        cena: 'Cena'
    };
    return mapa[valor] || obtenerNombreTipoComida(tipo);
}

function obtenerTituloReceta(receta, tipoFallback = '') {
    if (!receta) return '';
    const nombre = receta.Nombre || '';
    const tipo = String(receta.Tipo ?? receta.tipo ?? tipoFallback ?? '').trim();
    if (!tipo) return nombre;
    return `${obtenerNombreTipoComida(tipo)}: ${nombre}`;
}

function actualizarTipoRecetaLocal(recetaId, tipo) {
    if (!recetaId || !tipo) return;
    const idNumero = Number(recetaId);
    const tipoBaserow = obtenerTipoComidaBaserow(tipo);
    const index = estado.recetas.findIndex(r => Number(r.id) === idNumero);
    if (index >= 0) {
        estado.recetas[index] = {
            ...estado.recetas[index],
            Tipo: tipoBaserow
        };
    }
}

async function actualizarTipoRecetaEnBaserow(recetaId, tipo) {
    if (!recetaId || !tipo) return;
    const tipoBaserow = obtenerTipoComidaBaserow(tipo);
    try {
        await fetch(`${BASEROW_API}${TABLA_RECETAS}/${recetaId}/?user_field_names=true`, {
            method: 'PATCH',
            headers: {
                'Authorization': `Token ${TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ Tipo: tipoBaserow })
        });
    } catch (error) {
        console.error('No se pudo actualizar el tipo de la receta:', error);
    }
}

async function guardarPlanEnBaserow(fecha, tipo, recetaId) {
    const payload = {
        Fecha: fecha,
        Comida: obtenerTipoComidaBaserow(tipo),
        Active: true,
        Receta: [Number(recetaId)],
        '¿Completado?': false
    };

    actualizarTipoRecetaLocal(recetaId, tipo);
    await actualizarTipoRecetaEnBaserow(recetaId, tipo);

    const planActual = estado.planSemanal.find(p =>
        p.Fecha === fecha && normalizarTipoComida(p.Comida) === normalizarTipoComida(tipo) && tieneIdRealBaserow(p.id)
    );

    let respuesta;

    if (planActual && planActual.id) {
        try {
            const res = await fetch(`${BASEROW_API}${TABLA_PLAN}/${planActual.id}/?user_field_names=true`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Token ${TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                respuesta = await res.json();
            } else if (res.status === 404) {
                respuesta = await postBaserow(TABLA_PLAN, payload);
            } else {
                throw new Error(`Error HTTP: ${res.status}`);
            }
        } catch (error) {
            if (error && error.message && error.message.includes('404')) {
                respuesta = await postBaserow(TABLA_PLAN, payload);
            } else {
                throw error;
            }
        }
    } else {
        respuesta = await postBaserow(TABLA_PLAN, payload);
    }

    if (respuesta && respuesta.id) {
        await registrarConsumoReceta(Number(recetaId), 1, fecha);
    }

    return respuesta;
}

// ===== PLAN SEMANAL =====
function renderizarPlanSemanal() {
    const container = document.getElementById('planSemanalContainer');
    const dias = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
    const hoy = new Date();
    const inicioSemana = new Date(hoy.setDate(hoy.getDate() - hoy.getDay() + 1));
    
    // Actualizar fecha
    document.getElementById('semanaFecha').textContent = inicioSemana.toLocaleDateString('es', { month: 'long', day: 'numeric' });

    let html = '';
    for (let i = 0; i < 7; i++) {
        const fecha = new Date(inicioSemana);
        fecha.setDate(fecha.getDate() + i);
        const fechaStr = fecha.toISOString().split('T')[0];

function seleccionarRecetaDesdeModal(recetas, titulo) {
    return new Promise((resolve) => {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.style.display = 'block';

        const renderLista = (filtro = '') => {
            const texto = filtro.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
            const recetasFiltradas = !texto
                ? recetas
                : recetas.filter(receta => {
                    const nombre = String(obtenerTituloReceta(receta) || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                    const categoria = String(receta.Categoría || '').toLowerCase();
                    return nombre.includes(texto) || categoria.includes(texto);
                });

            const lista = modal.querySelector('.selector-recetas-lista');
            if (!lista) return;

            lista.innerHTML = recetasFiltradas.length === 0
                ? '<div class="text-sm text-gray-500 text-center py-3">No se encontraron recetas</div>'
                : recetasFiltradas.map((receta, index) => `
                    <button type="button" class="btn-selector-receta w-full text-left p-2 rounded-lg bg-gray-50 hover:bg-orange-50 border border-gray-200" data-id="${receta.id}">
                        <div class="font-medium">${index + 1}. ${obtenerTituloReceta(receta)}</div>
                        <div class="text-xs text-gray-500">${receta.Categoría || 'Sin categoría'} • ${receta.Tiempo || 30} min</div>
                    </button>
                `).join('');

            lista.querySelectorAll('.btn-selector-receta').forEach((btn) => {
                btn.onclick = () => {

                    const receta = recetas.find(r => r.id === id);

                    resolve(receta || null);

            });
        };

        modal.innerHTML = `
            <div class="modal-contenido">
                <div class="flex justify-between items-start mb-3">
                    <h3 class="text-xl font-bold">${titulo}</h3>
                    <button type="button" class="cerrar-selector text-gray-500 text-2xl hover:text-gray-700">&times;</button>

        });
        modal.onclick = (e) => { if (e.target === modal) cerrar(); };

        renderLista('');
    });
}

function wrapText(ctx, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let currentLine = '';

    words.forEach(word => {
        const testLine = currentLine ? `${currentLine} ${word}` : word;
        const width = ctx.measureText(testLine).width;
        if (width > maxWidth && currentLine) {
            lines.push(currentLine);
            currentLine = word;
        } else {
            currentLine = testLine;
        }
    });

    if (currentLine) lines.push(currentLine);
    return lines;
}

function obtenerBloquesPlanSemanal() {
    const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const items = [...estado.planSemanal].filter(item => item && item.Active !== false);

    const porFecha = {};
    items.forEach(item => {
        const fecha = String(item.Fecha || '').trim();
        if (!fecha) return;

        const recetaId = Number(item.Receta ?? item.receta ?? 0);
        if (!recetaId) return;

        const receta = estado.recetas.find(r => Number(r.id) === recetaId);
        if (!receta) return;

        const nombre = obtenerTituloReceta(receta);
        if (!nombre) return;

        const fechaObj = new Date(`${fecha}T12:00:00`);
        const diaNombre = dias[fechaObj.getDay()] || 'Día';

        if (!porFecha[fecha]) {
            porFecha[fecha] = { fecha, dia: diaNombre, comidas: [] };
        }

        const tipo = normalizarTipoComida(item.Comida || receta.Tipo || 'Comida');
        if (!tipo) return;

        porFecha[fecha].comidas.push({ tipo, nombre });
    });

    return Object.values(porFecha)
        .sort((a, b) => new Date(a.fecha) - new Date(b.fecha))
        .map(({ fecha, dia, comidas }) => ({
            fecha,
            dia,
            comidas: comidas.filter(c => c && c.nombre)
        }))
        .filter(({ comidas }) => comidas.length > 0);
}

function generarTextoPlanSemanal() {
    const bloques = obtenerBloquesPlanSemanal();

    if (bloques.length === 0) {
        return '🍽️ Plan semanal\n\nAún no hay comidas programadas para esta semana.';
    }

    const textoBloques = bloques.map(({ dia, fecha, comidas }) => {
        const lineas = comidas.map(c => `• ${obtenerNombreTipoComida(c.tipo)}: ${c.nombre}`);
        return `${dia} (${fecha})\n${lineas.join('\n')}`;
    });

    return `🍽️ Plan Semanal\n\n${textoBloques.join('\n\n')}`;
}

    ctx.quadraticCurveTo(panelX + panelW, panelY + panelH, panelX + panelW - 24, panelY + panelH);
    ctx.lineTo(panelX + 24, panelY + panelH);
    ctx.quadraticCurveTo(panelX, panelY + panelH, panelX, panelY + panelH - 24);
    ctx.lineTo(panelX, panelY + 24);
    ctx.quadraticCurveTo(panelX, panelY, panelX + 24, panelY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    const headerX = 58;

    ctx.moveTo(headerX + 20, headerY);
    ctx.lineTo(headerX + headerW - 20, headerY);
    ctx.quadraticCurveTo(headerX + headerW, headerY, headerX + headerW, headerY + 20);

    ctx.quadraticCurveTo(headerX + headerW, headerY + headerH, headerX + headerW - 20, headerY + headerH);

        comidas.forEach(comida => {
            const tipo = obtenerNombreTipoComida(comida.tipo);
            const nombre = comida.nombre.length > 42 ? `${comida.nombre.slice(0, 39)}…` : comida.nombre;

            ctx.quadraticCurveTo(blockX + 160, rowY, blockX + 160, rowY + 12);
            ctx.lineTo(blockX + 160, rowY + 32);
            ctx.quadraticCurveTo(blockX + 160, rowY + 44, blockX + 150, rowY + 44);
            ctx.lineTo(blockX + 36, rowY + 44);

function guardarPlanLocal(fecha, tipo, recetaId) {
    syncRequestId += 1;

    const item = {
        id: Date.now(),
        Fecha: fecha,
        Comida: normalizarTipoComida(tipo),
        Receta: recetaId,
        '¿Completado?': false
    };

    const yaExiste = estado.planSemanal.some(p => p.Fecha === fecha && normalizarTipoComida(p.Comida) === normalizarTipoComida(tipo));
    if (yaExiste) {
        estado.planSemanal = estado.planSemanal.map(p =>
            p.Fecha === fecha && normalizarTipoComida(p.Comida) === normalizarTipoComida(tipo)
                ? { ...p, Receta: recetaId, Comida: normalizarTipoComida(tipo) }
                : p
        );
    } else {
        estado.planSemanal.push(item);
    }

    renderizarPlanSemanal();
    return item;
}

async function agregarComidaRapida(fecha, tipo) {
    if (estado.recetas.length === 0) {
        alert('No hay recetas disponibles. ¡Agrega algunas primero!');
        return;
    }
    const receta = await seleccionarRecetaDesdeModal(estado.recetas, `Selecciona una receta para ${tipo === 'comida' ? 'Comida' : tipo} el ${fecha}`);
    if (!receta) return;

    const itemLocal = guardarPlanLocal(fecha, tipo, receta.id);
    actualizarTipoRecetaLocal(receta.id, tipo);
    renderizarTodo();

    try {
        const respuesta = await guardarPlanEnBaserow(fecha, tipo, receta.id);
        if (respuesta && respuesta.id) {
            const index = estado.planSemanal.findIndex(p =>
                p.Fecha === fecha && normalizarTipoComida(p.Comida) === normalizarTipoComida(tipo)
            );
            if (index >= 0) {
                estado.planSemanal[index].id = respuesta.id;
            }
        }
        renderizarPlanSemanal();
    } catch (e) {
        try {
            const respuesta = await postBaserow(TABLA_PLAN, {
                Fecha: fecha,
                Comida: obtenerTipoComidaBaserow(tipo),
                Active: true,
                Receta: [Number(receta.id)],
                '¿Completado?': false
            });
            if (respuesta && respuesta.id) {
                await registrarConsumoReceta(Number(receta.id), 1, fecha);
            }
            const index = estado.planSemanal.findIndex(p =>
                p.Fecha === fecha && normalizarTipoComida(p.Comida) === normalizarTipoComida(tipo)
            );
            if (index >= 0) {
                estado.planSemanal[index].id = respuesta.id;
            }
            renderizarPlanSemanal();
        } catch (fallbackError) {
            estado.planSemanal = estado.planSemanal.filter(p => !(p.Fecha === fecha && normalizarTipoComida(p.Comida) === normalizarTipoComida(tipo) && p.Receta === receta.id && p.id === itemLocal.id));
            renderizarPlanSemanal();
            alert('Error al agregar al plan. Intenta de nuevo.');
        }
    }
}

// Mientras el usuario escribe en "Agregar ingrediente...", filtra la lista visible
// y avisa si ese ingrediente ya está agregado, para no duplicarlo.
function filtrarListaComprasEnVivo() {
    const inputBusqueda = document.getElementById('inputListaCompras');
    const aviso = document.getElementById('avisoIngredienteExistente');
    const btnAgregar = document.getElementById('btnAgregarListaCompras');
    if (!inputBusqueda) return;

    const term = inputBusqueda.value.trim().toLowerCase();

    document.querySelectorAll('#despensaContainer > div').forEach(el => {
        el.style.display = !term || el.textContent.toLowerCase().includes(term) ? 'flex' : 'none';
    });

    const yaExiste = !!term && estado.listaCompras.some(item => item.Nombre.toLowerCase() === term);

    if (aviso) aviso.textContent = yaExiste ? `✓ "${inputBusqueda.value.trim()}" ya está en tu lista` : '';
    if (btnAgregar) {
        btnAgregar.disabled = yaExiste;
        btnAgregar.classList.toggle('opacity-50', yaExiste);
        btnAgregar.classList.toggle('cursor-not-allowed', yaExiste);
    }
}

function normalizarIngredienteBusqueda(linea) {
    const limpio = limpiarNombreIngrediente(linea || '');
    if (!limpio) return '';
    return limpio.toLowerCase().replace(/[^a-záéíóúñ\s]/g, '').replace(/\s+/g, ' ').trim();
}

function limpiarNombreIngrediente(linea) {
    const texto = String(linea || '').trim();
    if (!texto) return '';

    const unidades = [
        'gr', 'g', 'kg', 'mg', 'ml', 'l', 'cc', 'taza', 'tazas', 'cucharada', 'cucharadas',
        'cucharadita', 'cucharaditas', 'cdita', 'cdta', 'pieza', 'piezas', 'diente', 'dientes',
        'ramita', 'ramitas', 'hoja', 'hojas', 'rebanada', 'rebanadas', 'trozo', 'trozos',
        'pizca', 'pizcas', 'unidad', 'unidades', 'sobre', 'sobres', 'litro', 'litros', 'ml', 'cl', 'oz'
    ];

    const sinCantidad = texto
        .replace(/^\s*(?:\d+\s*\/\s*\d+|\d+\.\d+|\d+)\s*/i, '')
        .trim();

    if (!sinCantidad) return '';

    const partes = sinCantidad.split(/\s+/);
    if (partes.length > 0) {
        const primer = partes[0].toLowerCase();
        if (unidades.includes(primer)) {
            let inicio = 1;
            if (partes[1] && partes[1].toLowerCase() === 'de') {
                inicio = 2;
            }
            const resto = partes.slice(inicio).join(' ').trim();
            if (resto) return resto;
        }
    }

    const sinPrefijo = sinCantidad.replace(/^de\s+/i, '').trim();
    if (!sinPrefijo) return '';

    return sinPrefijo.replace(/\s*[-–—]\s*.*$/, '').trim();
}

async function agregarIngredientesDelPlanAListaCompras() {
    const idsPlan = [...new Set(estado.planSemanal
        .map(p => p.Receta)
        .filter(valor => valor !== null && valor !== undefined && valor !== '')
        .map(Number)
        .filter(Number.isFinite)
    )];

    const recetasDelPlan = estado.recetas.filter(receta => idsPlan.includes(Number(receta.id)));
    const nombres = new Set();

    recetasDelPlan.forEach(receta => {
        const ingredientes = receta.Ingredientes || '';
        ingredientes.split('\n').forEach(linea => {
            const limpio = limpiarNombreIngrediente(linea);
            if (!limpio) return;

            const nombreNormalizado = limpio.replace(/\s+/g, ' ').trim();
            if (nombreNormalizado.length > 0) {
                nombres.add(nombreNormalizado.charAt(0).toUpperCase() + nombreNormalizado.slice(1));
            }
        });
    });

    const pendientes = [...nombres].filter(nombre =>
        !estado.listaCompras.some(item => String(item.Nombre || '').toLowerCase() === nombre.toLowerCase())
    );

    if (pendientes.length === 0) {
        alert('Ya están todos los ingredientes del plan en la lista de compras.');
        return;
    }

    for (const nombre of pendientes) {
        await agregarListaCompras(nombre);
    }

    renderizarDespensa();
    alert(`Se agregaron ${pendientes.length} ingredientes del plan a la lista de compras.`);
}

function buscarRecetasPorIngredientes() {
    const container = document.getElementById('resultadosPorIngredientes');
    if (!container) return;

    if (ingredientesDisponibles.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-center">Agrega ingredientes para buscar recetas</p>';
        return;
    }

    const resultados = estado.recetas
        .map(receta => {
            const ingredientesReceta = (receta.Ingredientes || '')
                .split('\n')
                .map(normalizarIngredienteBusqueda)
                .filter(Boolean);

            const faltantes = ingredientesDisponibles.filter(ing => {
                const ingreso = normalizeForMatch(ing);
                return !ingredientesReceta.some(item => item.includes(ingreso) || ingreso.includes(item));
            });

            const coincidencias = ingredientesDisponibles.filter(ing => {
                const ingreso = normalizeForMatch(ing);
                return ingredientesReceta.some(item => item.includes(ingreso) || ingreso.includes(item));
            }).length;

            const cumpleTodos = faltantes.length === 0;
            const porcentaje = ingredientesDisponibles.length > 0
                ? Math.round((coincidencias / ingredientesDisponibles.length) * 100)
                : 0;

            return {
                ...receta,
                coincidencias,
                totalIngredientes: ingredientesReceta.length,
                porcentaje,
                cumpleTodos,
                ingredientesFaltantes: faltantes.slice(0, 5)
            };
        })
        .filter(receta => receta.cumpleTodos)
        .sort((a, b) => b.porcentaje - a.porcentaje || (a.Nombre || '').localeCompare(b.Nombre || ''));

    if (resultados.length === 0) {
        container.innerHTML = `
            <div class="bg-yellow-50 p-4 rounded-lg text-center">
                <p class="text-yellow-800">😅 No se encontraron recetas con esos ingredientes</p>
                <p class="text-sm text-gray-600 mt-1">Prueba con otros ingredientes o prueba buscar por título y categoría</p>
            </div>
        `;
        return;
    }

    container.innerHTML = `
        <div class="flex justify-between items-center mb-2">
            <h4 class="font-semibold">📋 ${resultados.length} recetas encontradas</h4>
            <span class="text-xs text-gray-500">Coinciden con todos los ingredientes</span>
        </div>
        ${resultados.map(receta => `
            <div class="card-receta-match rounded-xl p-3 shadow-sm border border-amber-300 bg-gradient-to-r from-amber-50 via-orange-50 to-white relative overflow-hidden cursor-pointer" data-id="${receta.id}">
                <div class="absolute top-2 right-2 px-2 py-1 text-[10px] font-bold uppercase tracking-wide rounded-full bg-amber-200 text-amber-900">
                    Coincide
                </div>
                <div class="flex justify-between items-start pr-2">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 flex-wrap">
                            <h3 class="font-bold">${obtenerTituloReceta(receta)}</h3>
                            <span class="badge-categoria ${getBadgeClass(receta.Categoría)}">${receta.Categoría || 'Sin categoría'}</span>
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            <div class="w-24 bg-gray-200 rounded-full h-2">
                                <div class="bg-orange-500 h-2 rounded-full" style="width: ${receta.porcentaje}%"></div>
                            </div>
                            <span class="text-xs font-medium text-orange-700">${receta.porcentaje}% coincide</span>
                        </div>
                    </div>
                </div>
            </div>
        `).join('')}
    `;

    document.querySelectorAll('#resultadosPorIngredientes .card-receta-match').forEach(card => {
        card.onclick = () => {
            const receta = estado.recetas.find(r => r.id === parseInt(card.dataset.id));
            if (receta) mostrarDetalleReceta(receta);
        };
    });
}

function normalizeForMatch(value) {
    return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
}

function setBotonCargando(btn, cargando, textoCargando = 'Guardando...') {
    if (!btn) return;
    if (cargando) {
        if (btn.dataset.textoOriginal === undefined) {
            btn.dataset.textoOriginal = btn.innerHTML;
        }
        btn.disabled = true;
        btn.classList.add('opacity-70', 'cursor-not-allowed');
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${textoCargando}`;
    } else {
        btn.disabled = false;
        btn.classList.remove('opacity-70', 'cursor-not-allowed');
        if (btn.dataset.textoOriginal !== undefined) {
            btn.innerHTML = btn.dataset.textoOriginal;
            delete btn.dataset.textoOriginal;
        }
    }
}

// ===== RECOMENDACIONES =====
function normalizarRelacionId(valor) {
    if (Array.isArray(valor)) {
        if (valor.length === 0) return null;
        const primero = valor[0];
        if (primero && typeof primero === 'object') {
            return Number(primero.id ?? primero.value ?? primero);
        }
        return Number(primero);
    }

    if (valor && typeof valor === 'object') {
        return Number(valor.id ?? valor.value ?? valor);
    }

    if (valor === null || valor === undefined || valor === '') return null;
    const numero = Number(valor);
    return Number.isFinite(numero) ? numero : null;
}

function calcularConsumoPorReceta() {
    const consumoPorReceta = {};

    estado.historial.forEach(item => {
        if (!item || item.Active === false) return;
        const recetaId = normalizarRelacionId(item.Receta ?? item.receta);
        if (!recetaId) return;

        const veces = Number(item.Veces_comido ?? item.VecesComido ?? item.veces_comido ?? 1);
        const cantidad = Number.isFinite(veces) && veces > 0 ? veces : 1;
        consumoPorReceta[recetaId] = (consumoPorReceta[recetaId] || 0) + cantidad;
    });

    return consumoPorReceta;
}

async function registrarConsumoReceta(recetaId, cantidad = 1, fecha = null) {
    const id = Number(recetaId);
    if (!id || cantidad <= 0) return null;

    const fechaHoy = fecha || new Date().toISOString().split('T')[0];
    const filas = estado.historial.filter(item => {
        if (!item || item.Active === false) return false;
        const recetaIdItem = normalizarRelacionId(item.Receta ?? item.receta);
        const fechaItem = String(item.Fecha || item.fecha || '').slice(0, 10);
        return recetaIdItem === id && fechaItem === fechaHoy;
    });

    const fila = filas[0];
    const totalActual = Number(fila?.Veces_comido ?? fila?.VecesComido ?? fila?.['Veces comido'] ?? fila?.['# Veces comido'] ?? 0);
    const nuevoTotal = totalActual + cantidad;

    const variantesVeces = [
        'Veces_comido',
        'Veces comido',
        'Veces Comido',
        'VecesComido',
        '# Veces comido',
        '# Veces_comido'
    ];

    const hacerPatchConFallback = async (payload) => {
        const candidates = Object.entries(payload).map(([key, value]) => {
            const base = { [key]: value };
            if (key === 'Veces_comido') {
                return [base, { 'Veces comido': value }, { 'VecesComido': value }, { '# Veces comido': value }];
            }
            return [base];
        }).flat();

        for (const item of candidates) {
            try {
                const respuesta = await fetch(`${BASEROW_API}${TABLA_HISTORIAL}/${fila.id}/?user_field_names=true`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Token ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(item)
                });
                if (respuesta.ok) {
                    return await respuesta.json();
                }
            } catch (error) {
                console.warn('Fallo al hacer patch de historial, probando siguiente nombre de campo:', error);
            }
        }

        return null;
    };

    if (fila && fila.id) {
        const patch = await hacerPatchConFallback({ Veces_comido: nuevoTotal });
        if (patch) {
            estado.historial = estado.historial.map(item => 
                Number(item.id) === Number(fila.id) ? { ...item, Veces_comido: nuevoTotal } : item
            );
        }
        return patch;
    }

    const payloads = [
        { Receta: [id], Active: true, Fecha: fechaHoy, Veces_comido: cantidad },
        { Receta: [id], Active: true, Fecha: fechaHoy, 'Veces comido': cantidad },
        { Receta: [id], Active: true, Fecha: fechaHoy, VecesComido: cantidad },
        { Receta: [id], Active: true, Fecha: fechaHoy, '# Veces comido': cantidad }
    ];

    for (const payload of payloads) {
        try {
            const respuesta = await postBaserow(TABLA_HISTORIAL, payload);
            if (respuesta && respuesta.id) {
                estado.historial = [
                    ...estado.historial,
                    {
                        ...respuesta,
                        Receta: [id],
                        Active: true,
                        Fecha: fechaHoy,
                        Veces_comido: cantidad
                    }
                ];
                return respuesta;
            }
        } catch (error) {
            console.warn('Fallo al crear fila en historial, probando siguiente nombre de campo:', error);
        }
    }

    return null;
}
